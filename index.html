<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="مكتبتك الذكية لصناعة الموسيقى والتعليق الصوتي: 35 برومبت Suno جاهز للنسخ والتخصيص.">
<meta name="theme-color" content="#F8F5EF">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Prompt Studio">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
/* Base reset (was provided by the Claude host before) */
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Suno Prompt Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Changa:wght@600;700;800&family=El+Messiri:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Cormorant+Garamond:ital,wght@0,600;1,500;1,600&family=Playfair+Display:wght@600;700&display=swap">
<style>
/* Layout: sticky ivory header + gold-ruled section cards; library grid; bottom tab bar on phones, header tabs on desktop. Single light theme by design. */
:root{
  --cream:#F8F5EF;
  --paper:#FFFDF9;
  --ink:#2A251E;
  --ink-soft:#6B6052;
  --gold:#C5A46D;
  --gold-deep:#8E6E3A;
  --gold-wash:#F1E8D8;
  --line:#E7DDCC;
  --ok:#3F7A4E;
  --danger:#A2453A;
  --shadow:0 1px 2px rgba(80,60,30,.06),0 8px 24px -12px rgba(80,60,30,.18);
  --f-display:"Changa","El Messiri","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --f-latin:"Cormorant Garamond",Georgia,serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;direction:rtl}
body{direction:rtl;text-align:right}
body{background:var(--cream);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.7;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 130px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--cream)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold-deep);outline-offset:2px}
.wrap{max-width:1080px;margin-inline:auto}

/* Header */
header.top{position:relative;z-index:20;background:transparent;
  margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px))) calc(-1 * max(16px,env(safe-area-inset-right,0px)));
  padding-inline:max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-left,0px))}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:14px 16px;padding-block:22px 4px}
.brand{display:flex;flex-direction:column;line-height:1.1;margin-inline-end:auto}
.brand b{font-family:var(--f-latin);font-size:26px;font-weight:600;letter-spacing:.01em;direction:ltr;text-align:right}
.brand b i{color:var(--gold-deep);font-weight:500}
.brand small{font-size:12px;color:var(--ink-soft)}
.suno-link{font-family:var(--f-display);display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--paper);background:var(--ink);border-radius:999px;padding:8px 16px;font-size:13px;font-weight:600;white-space:nowrap}
.suno-link svg{width:14px;height:14px}

/* Tabs */
nav.tabs{order:3;flex-basis:100%;display:flex;gap:6px;background:linear-gradient(180deg,#FFFEFB,#FFFAF1);border:1px solid #EADFC9;border-radius:22px;padding:7px;
  box-shadow:0 1px 2px rgba(120,90,40,.05),0 16px 32px -22px rgba(120,90,40,.45);position:relative}
nav.tabs::after{content:"";position:absolute;inset:3px;border:1px solid rgba(197,164,109,.28);border-radius:18px;pointer-events:none}
.tab{flex:1;justify-content:center;border:0;background:none;padding:11px 14px;border-radius:16px;font-family:var(--f-display);font-size:17.5px;font-weight:600;letter-spacing:.01em;color:#5A4E3E;display:flex;align-items:center;gap:8px;transition:background .15s,color .15s;position:relative;z-index:1}
.tab svg{width:21px;height:21px;color:var(--gold-deep)}
.tab:hover{background:var(--gold-wash)}
.tab[aria-current="page"]{background:linear-gradient(180deg,#D3B47E,#C5A46D 50%,#B08D55);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 6px 14px -8px rgba(142,110,58,.7)}
.tab[aria-current="page"] svg{color:#fff}
.tab[aria-current="page"] .count{background:#fff;color:var(--gold-deep)}
.tab .count{font-size:11px;background:var(--gold);color:#fff;border-radius:999px;padding:0 6px;line-height:18px;font-variant-numeric:tabular-nums}
.tab .count[data-zero]{display:none}
@media (max-width:760px){
  nav.tabs{position:fixed;z-index:30;gap:2px;padding:6px;border-radius:24px;
    left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));
    box-shadow:0 2px 4px rgba(120,90,40,.08),0 18px 36px -14px rgba(80,60,30,.45)}
  nav.tabs::after{border-radius:20px}
  .tab{flex-direction:column;gap:3px;font-size:13px;padding:8px 2px;border-radius:18px;min-width:0}
  .tab svg{width:22px;height:22px}
  .tab .count{position:absolute;top:2px;inset-inline-start:50%;margin-inline-start:6px}
  .brand b{font-size:22px}
}

/* Sections */
main{padding-block:28px 0}
.view{display:flex;flex-direction:column;gap:22px}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--gold-deep);font-weight:600}
h1,h2,h3{font-family:var(--f-display);font-weight:600;text-wrap:balance;margin:0;line-height:1.3}
h1{font-size:clamp(26px,5vw,36px)}
h2{font-size:21px}
h3{font-size:17px}
.lead{color:var(--ink-soft);max-width:62ch;margin:6px 0 0}
.formula{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.formula span{font-size:12.5px;border:1px solid var(--gold);color:var(--gold-deep);border-radius:999px;padding:2px 12px;background:var(--paper)}
.formula em{font-style:normal;color:var(--gold);align-self:center}

/* Search */
.search{position:relative}
.search input{width:100%;font-size:16px;padding:14px 46px 14px 44px;border:1px solid var(--line);border-radius:14px;background:var(--paper);box-shadow:var(--shadow);outline:none}
.search input:focus{border-color:var(--gold)}
.search .ico{position:absolute;inset-inline-start:16px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--gold-deep);pointer-events:none}
.search .clear{position:absolute;inset-inline-end:8px;top:50%;transform:translateY(-50%);border:0;background:var(--gold-wash);width:30px;height:30px;border-radius:50%;font-size:16px;line-height:1}

/* Category cards */
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.cat{text-align:start;border:1px solid var(--line);background:var(--paper);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;transition:border-color .15s,background .15s}
.cat b{font-family:var(--f-display);font-weight:600;font-size:15px}
.cat small{color:var(--ink-soft);font-size:12px;font-variant-numeric:tabular-nums}
.cat:hover{border-color:var(--gold)}
.cat[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.cat[aria-pressed="true"] small{color:#D9C7A4}
.cat-note{font-size:13.5px;color:var(--ink-soft);border-inline-start:2px solid var(--gold);padding-inline-start:12px;margin:0}
.meta-line{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.meta-line .n{font-size:13px;color:var(--ink-soft);font-variant-numeric:tabular-nums}

/* Prompt cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
@media (max-width:400px){.grid{grid-template-columns:1fr}}
.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow);min-width:0}
.card-head{display:flex;gap:10px;align-items:flex-start}
.card-head .titles{flex:1;min-width:0;cursor:pointer}
.card-head .titles small{display:block;font-size:12px;color:var(--gold-deep)}
.card-head h3 button{all:unset;cursor:pointer;font-family:var(--f-display)}
.note{font-size:12.5px;color:var(--ink-soft)}
.en{direction:ltr;text-align:left;font-family:var(--f-mono);font-size:13px;line-height:1.65;color:#3B342A;background:var(--cream);border-radius:10px;padding:10px 12px;margin:0;overflow-wrap:anywhere}
.card .en{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;border-radius:999px;padding:2px 10px;background:var(--gold-wash);color:#5E4A28;direction:ltr}
.chip.bpm{background:var(--ink);color:var(--paper);font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.card-actions{display:flex;gap:8px;margin-top:auto;flex-wrap:wrap}

/* Buttons */
.btn{font-family:var(--f-display);border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:9px 14px;font-size:14px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px}
.btn svg{width:16px;height:16px;flex:none}
.btn:hover{border-color:var(--gold)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#fff;font-weight:600}
.btn.gold:hover{background:#B8955B}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.btn.grow{flex:1}
.btn.danger{color:var(--danger)}
.btn.danger.armed{background:var(--danger);border-color:var(--danger);color:#fff}
.star{border:1px solid var(--line);background:var(--paper);width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none;color:var(--gold-deep)}
.star svg{width:20px;height:20px}
.star[aria-pressed="true"]{background:var(--gold-wash);border-color:var(--gold)}
.star[aria-pressed="true"] svg path{fill:var(--gold)}

/* Empty */
.empty{border:1px dashed var(--gold);border-radius:18px;padding:32px 20px;text-align:center;color:var(--ink-soft);background:var(--paper)}
.empty h3{color:var(--ink);margin-bottom:4px}

/* Sheet */
.overlay{position:fixed;inset:0;background:rgba(42,37,30,.42);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px))}
.sheet{background:var(--paper);border-radius:22px;width:min(620px,100%);max-height:88vh;overflow:auto;-webkit-overflow-scrolling:touch;padding:22px;display:flex;flex-direction:column;gap:14px;box-shadow:0 30px 60px -20px rgba(40,30,15,.45);border-top:3px solid var(--gold)}
@media (max-width:760px){
  .overlay{align-items:flex-end;padding:0}
  .sheet{border-radius:22px 22px 0 0;max-height:90vh;padding:20px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
}
.sheet-head{display:flex;align-items:flex-start;gap:10px}
.sheet-head > div{flex:1;min-width:0}
.x{border:0;background:var(--gold-wash);width:36px;height:36px;border-radius:50%;font-size:20px;line-height:1;flex:none}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;align-items:center}
.kv dt{color:var(--ink-soft)}
.kv dd{margin:0}
.chars{font-family:var(--f-mono);font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.chars.over{color:var(--danger)}
.row{display:flex;gap:8px;flex-wrap:wrap}

/* Editor */
.panel{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow);min-width:0}
.ed-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:16px;align-items:start}
@media (max-width:860px){.ed-grid{grid-template-columns:1fr}}
.ed-col{display:flex;flex-direction:column;gap:16px;min-width:0}
label.lbl{font-weight:600;font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
textarea,input[type=text],input[type=number]{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--cream);padding:10px 12px;font-size:16px;outline:none}
textarea:focus,input:focus{border-color:var(--gold)}
textarea.en-in{direction:ltr;text-align:left;font-family:var(--f-mono);font-size:14px;min-height:120px;resize:vertical;line-height:1.6}
.bpm-row{display:flex;align-items:center;gap:12px}
.bpm-row input[type=range]{flex:1;accent-color:var(--gold-deep);direction:ltr}
.bpm-row input[type=number]{width:86px;text-align:center;font-family:var(--f-mono);direction:ltr}
.ichip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--gold);background:var(--gold-wash);color:#5E4A28;border-radius:999px;padding:3px 6px 3px 12px;font-size:13px;direction:ltr}
.ichip button{border:0;background:rgba(255,255,255,.7);width:22px;height:22px;border-radius:50%;line-height:1;font-size:14px;padding:0}
.ichip.off{background:transparent;border-style:dashed;color:var(--ink-soft);text-decoration:line-through}
.ichip.off button{text-decoration:none}
.ichip.new{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.ichip.new button{background:rgba(255,255,255,.2);color:var(--paper)}
.add-row{display:flex;gap:8px}
.add-row input{direction:ltr;text-align:left}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;direction:ltr;background:var(--paper);cursor:pointer;user-select:none}
.opt input{accent-color:var(--gold-deep);width:16px;height:16px;margin:0}
.opt:has(input:checked){border-color:var(--gold);background:var(--gold-wash)}
.hint{font-size:12.5px;color:var(--ink-soft);margin:0}
.result{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px)}
.result .en{font-size:14px;background:var(--cream);border:1px solid var(--line);min-height:100px}
.badge{font-size:11.5px;border-radius:999px;padding:1px 10px;background:var(--gold-wash);color:var(--gold-deep);font-weight:600}

/* Tips */
.tips{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.tip{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:6px}
.tip h3{color:var(--gold-deep)}
.tip p{margin:0;font-size:14.5px}
.tip code,.panel code{font-family:var(--f-mono);font-size:13px;background:var(--gold-wash);border-radius:6px;padding:0 6px;direction:ltr;unicode-bidi:isolate}
.callout{border:1px solid var(--gold);background:var(--gold-wash);border-radius:16px;padding:16px}
.callout p{margin:4px 0 0}
ol.steps{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:6px}

/* Toast */
.toast{position:fixed;left:50%;bottom:calc(104px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;font-size:14px;font-weight:500;z-index:80;transition:opacity .2s,transform .2s;pointer-events:none;display:flex;gap:8px;align-items:center;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast svg{width:16px;height:16px;color:#9FD3A9}
@media (min-width:761px){.toast{bottom:32px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* ===== Home ===== */
body[data-view="home"] .brand{visibility:hidden}
.hero{position:relative;overflow:hidden;border-radius:28px;background:radial-gradient(120% 90% at 50% 0%,#FFFDF8 0%,#FBF7EF 55%,#F3EBDD 100%);
  border:1px solid #EADFC9;box-shadow:0 2px 4px rgba(120,90,40,.05),0 24px 48px -28px rgba(120,90,40,.35);
  padding:34px 22px 28px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px}
.hero::after{content:"";position:absolute;inset:8px;border:1px solid rgba(197,164,109,.35);border-radius:22px;pointer-events:none}
.waves{position:absolute;left:0;width:100%;height:120px;pointer-events:none}
.waves.t{top:0}
.waves.b{bottom:0;transform:scaleY(-1)}
.waves path{fill:none;stroke:var(--gold);vector-effect:non-scaling-stroke}
.hero-art{position:relative;width:min(230px,62vw);aspect-ratio:240/190;max-width:100%;filter:drop-shadow(0 14px 18px rgba(142,110,58,.28))}
.hero-art svg{width:100%;height:100%;display:block}
.hero-title{font-family:"Playfair Display",var(--f-latin);font-weight:700;font-size:clamp(34px,7.6vw,58px);line-height:1.05;letter-spacing:.005em;margin:10px 0 0;color:var(--ink);direction:ltr;position:relative}
.hero-title span{font-family:var(--f-latin);font-style:italic;font-weight:600;background:linear-gradient(180deg,#D9BC84 0%,#C5A46D 45%,#9A7840 100%);-webkit-background-clip:text;background-clip:text;color:transparent;padding-inline:.06em}
.ornament{display:flex;align-items:center;gap:10px;color:var(--gold);margin:8px 0 2px;position:relative}
.ornament i{display:block;width:56px;height:1px;background:linear-gradient(90deg,transparent,var(--gold))}
.ornament i:last-child{transform:scaleX(-1)}
.ornament svg{width:12px;height:12px}
.hero-sub{font-family:var(--f-display);font-size:clamp(15px,3.9vw,20px);text-wrap:balance;color:#5A4E3E;margin:0;position:relative}
.hero-search{position:relative;width:min(620px,100%);margin-top:18px;display:flex;align-items:center;background:var(--paper);border:1px solid #E3D5BB;border-radius:999px;
  box-shadow:0 10px 26px -14px rgba(142,110,58,.45);padding:6px;gap:6px}
.hero-search .ico{position:static;transform:none;margin-inline:12px 2px;flex:none;width:18px;height:18px;color:var(--gold-deep)}
.hero-search input{flex:1;min-width:0;border:0;background:transparent;font-size:16px;padding:10px 4px;outline:none}
.hero-search button{font-family:var(--f-display);font-size:16px;border:0;background:linear-gradient(180deg,#D3B47E,#C5A46D 50%,#B08D55);color:#fff;font-weight:600;border-radius:999px;padding:10px 20px;box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.facts{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:14px;position:relative}
.facts span{font-size:12.5px;color:var(--gold-deep);background:rgba(255,255,255,.7);border:1px solid #E6D7BA;border-radius:999px;padding:3px 12px;font-variant-numeric:tabular-nums}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.sec-head h2{display:flex;align-items:center;gap:10px}
.sec-head h2::before{content:"";width:8px;height:8px;background:var(--gold);transform:rotate(45deg);flex:none}
.link{font-family:var(--f-display);border:0;background:none;color:var(--gold-deep);font-weight:600;font-size:14px;padding:4px 0;white-space:nowrap}
.hcats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media (max-width:860px){.hcats{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}}
.hcat{position:relative;text-align:start;border:1px solid #EDE3D1;background:linear-gradient(180deg,#FFFEFB,#FFFBF4);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px;
  box-shadow:0 1px 2px rgba(120,90,40,.05),0 14px 30px -20px rgba(120,90,40,.4);transition:transform .2s,box-shadow .2s,border-color .2s;min-width:0}
.hcat:hover{transform:translateY(-2px);border-color:var(--gold);box-shadow:0 1px 2px rgba(120,90,40,.05),0 20px 36px -20px rgba(120,90,40,.5)}
.hcat .ic{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:var(--gold-deep);
  background:radial-gradient(circle at 35% 30%,#FFFFFF,#F2E7D2);box-shadow:inset 0 0 0 1px rgba(197,164,109,.6),0 6px 12px -6px rgba(142,110,58,.5)}
.hcat .ic svg{width:24px;height:24px}
.hcat b{font-family:var(--f-display);font-weight:600;font-size:15.5px;line-height:1.45}
.hcat .foot{display:flex;align-items:center;justify-content:space-between;margin-top:auto}

/* ===== Copy (iPhone / Safari / desktop) ===== */
function legacyCopy(text){
  var ta=document.createElement("textarea");
  ta.value=text;ta.setAttribute("readonly","");
  ta.style.cssText="position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;font-size:16px;border:0;padding:0";
  document.body.appendChild(ta);
  var ok=false;
  try{
    ta.contentEditable="true";ta.readOnly=false;
    var range=document.createRange();range.selectNodeContents(ta);
    var sel=window.getSelection();sel.removeAllRanges();sel.addRange(range);
    ta.setSelectionRange(0,text.length);
    ok=document.execCommand("copy");
    sel.removeAllRanges();
  }catch(e){ok=false}
  document.body.removeChild(ta);
  return ok;
}
function copyText(text){
  var done=function(){toast("تم النسخ بنجاح")};
  var fail=function(){ if(legacyCopy(text)) done(); else manualCopy(text); };
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(done,fail);
      return;
    }
  }catch(e){}
  fail();
}

/* ===== Prompt builder ===== */
function segs(t){return String(t).split(",").map(function(s){return s.trim()}).filter(Boolean)}
function lc(s){return s.trim().toLowerCase()}
function build(st){
  var s=segs(st.base),has=false,b=parseInt(st.bpm,10);
  s=s.map(function(x){ if(/\d+\s*BPM/i.test(x)){has=true; return b?x.replace(/\d+\s*BPM/i,b+" BPM"):x.replace(/\s*\d+\s*BPM/i,"").trim();} return x;}).filter(Boolean);
  if(!has&&b) s.push(b+" BPM");
  var rm=st.removed.map(lc);
  s=s.filter(function(x){return rm.indexOf(lc(x))<0});
  if(st.added.length){
    var ins=st.inst.map(lc),idx=-1;
    s.forEach(function(x,k){if(ins.indexOf(lc(x))>=0)idx=k});
    if(idx<0){var bi=-1;s.forEach(function(x,k){if(/BPM/i.test(x)&&bi<0)bi=k});idx=bi>0?bi-1:0}
    var add=st.added.filter(function(a){return s.map(lc).indexOf(lc(a))<0});
    s.splice.apply(s,[idx+1,0].concat(add));
  }
  st.options.forEach(function(o){if(s.map(lc).indexOf(lc(o))<0)s.push(o)});
  return s.join(", ");
}
function presentInst(st){var b=segs(st.base).map(lc);return st.inst.filter(function(i){return b.indexOf(lc(i))>=0})}

  '</div><div class="ed-col result">'+
   '<div class="panel"><div class="lbl">البرومبت الناتج <span class="chars" id="edChars"></span></div><p class="en" id="edOut"></p>'+
    '<div class="row"><button class="btn gold grow" data-act="copyout">'+ICON.copy+'نسخ البرومبت المعدل</button><button class="btn" data-act="copyorig">نسخ الأصلي</button></div></div>'+
   '<div class="panel"><label class="lbl" for="edName">اسم النسخة</label><input type="text" id="edName">'+
    '<div class="row"><button class="btn dark grow" data-act="savemine">'+ICON.save+(st.mineId?'حفظ التعديلات':'حفظ في برومبتاتي')+'</button><button class="btn" data-act="reset">'+ICON.reset+'استعادة النص الأصلي</button></div></div>'+
  '</div></div></section>';
  $("#edBase").value=st.base;$("#edName").value=st.name;
  $("#edBpmR").value=st.bpm;$("#edBpmN").value=st.bpm;
  $("#edBase").addEventListener("input",function(e){st.base=e.target.value;edUpdate()});
  $("#edName").addEventListener("input",function(e){st.name=e.target.value});
  $("#edBpmR").addEventListener("input",function(e){st.bpm=parseInt(e.target.value,10);$("#edBpmN").value=st.bpm;edUpdate()});
  $("#edBpmN").addEventListener("input",function(e){var v=parseInt(e.target.value,10);if(v>=40&&v<=180){st.bpm=v;$("#edBpmR").value=v;edUpdate()}});
  $("#edBpmN").addEventListener("change",function(e){var v=parseInt(e.target.value,10);if(!(v>=40))v=40;if(v>180)v=180;st.bpm=v;e.target.value=v;$("#edBpmR").value=v;edUpdate()});
  $("#edAdd").addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();addInst()}});
  edUpdate();
}
function edUpdate(){
  var st=ui.editor,p=byId[st.sourceId];
  var pres=presentInst(st);
  var instHTML=pres.map(function(i){var off=st.removed.map(lc).indexOf(lc(i))>=0;
     return '<span class="ichip'+(off?' off':'')+'">'+esc(i)+'<button data-act="toginst" data-v="'+esc(i)+'" aria-label="'+(off?'إرجاع':'حذف')+' '+esc(i)+'">'+(off?'↺':'×')+'</button></span>'}).join("")+
   st.added.map(function(i,k){return '<span class="ichip new">'+esc(i)+'<button data-act="rmadd" data-k="'+k+'" aria-label="حذف '+esc(i)+'">×</button></span>'}).join("")||'<span class="hint">ما في آلات في النص الحالي.</span>';
  var ie=$("#edInst");if(ie._h!==instHTML){ie.innerHTML=instHTML;ie._h=instHTML}
  var optsHTML=OPTIONS.map(function(o,k){return '<label class="opt"><input type="checkbox" id="opt'+k+'" data-opt="'+esc(o)+'"'+(st.options.indexOf(o)>=0?' checked':'')+'>'+esc(o)+'</label>'}).join("");
  var oe=$("#edOpts");if(oe._h!==optsHTML){oe.innerHTML=optsHTML;oe._h=optsHTML}
  var out=build(st);st.output=out;
  $("#edOut").textContent=out;
  var c=$("#edChars");c.textContent=out.length+" / "+MAXCH+" حرف";c.className="chars"+(out.length>MAXCH?" over":"");
  var changed=out!==p.text;$("#baseBadge").textContent=st.base===p.text?"أصلي":"معدّل";
  $("#baseBadge").hidden=false;
  return changed;
}
function addInst(){
  var st=ui.editor,inp=$("#edAdd"),v=inp.value.replace(/,/g," ").trim();
  if(!v)return;
  var all=segs(st.base).map(lc).concat(st.added.map(lc));
  if(all.indexOf(lc(v))>=0){toast("الآلة موجودة أصلًا");return}
  st.added.push(v);inp.value="";edUpdate();
}

/* ===== Events ===== */
document.addEventListener("change",function(e){
  var o=e.target.getAttribute&&e.target.getAttribute("data-opt");
  if(o&&ui.editor){var st=ui.editor,i=st.options.indexOf(o);
    if(e.target.checked&&i<0)st.options.push(o);if(!e.target.checked&&i>=0)st.options.splice(i,1);edUpdate()}
});
var armed=null,armT;
document.addEventListener("click",function(e){
  var g=e.target.closest("[data-go]");if(g){closeSheet();go(g.getAttribute("data-go"));window.scrollTo(0,0);return}
  var a=e.target.closest("[data-act]");if(!a)return;
  var act=a.getAttribute("data-act"),id=a.getAttribute("data-id");
  if(act==="backdrop"){if(e.target===a){closeSheet();if(current()==="home")renderHome()}return}
  switch(act){
   case "copy": copyText(byId[id].text); break;
   case "open": openDetail(id); break;
   case "close": closeSheet();if(current()==="home")renderHome(); break;
   case "fav":
     var i=favs.indexOf(id);if(i>=0){favs.splice(i,1);toast("أُزيل من المفضلة")}else{favs.push(id);toast("أُضيف للمفضلة")}
     persistFavs();
     document.querySelectorAll('.star[data-id="'+id+'"]').forEach(function(s){s.setAttribute("aria-pressed",String(i<0))});
     if(!layer.innerHTML){if(current()==="favorites")renderFavs();else if(current()==="home")renderHome();}
     break;
   case "custom": startEditor(id); break;
   case "gocat": ui.cat=a.getAttribute("data-cat");ui.q="";go("library");window.scrollTo(0,0); break;
   case "cat": ui.cat=a.getAttribute("data-cat");renderList(); break;
   case "clearq": ui.q="";$("#q").value="";a.hidden=true;renderList();$("#q").focus(); break;
   case "toginst":
     var st=ui.editor,v=a.getAttribute("data-v"),k=st.removed.map(lc).indexOf(lc(v));
     if(k>=0)st.removed.splice(k,1);else st.removed.push(v);edUpdate(); break;
   case "rmadd": ui.editor.added.splice(parseInt(a.getAttribute("data-k"),10),1);edUpdate(); break;
   case "addinst": addInst(); break;
   case "copyout": copyText(ui.editor.output); break;
   case "copyorig": copyText(byId[ui.editor.sourceId].text); break;
   case "reset":
     var s0=ui.editor,f=freshState(byId[s0.sourceId]);f.mineId=s0.mineId;f.name=s0.name;ui.editor=f;renderEditor();toast("رجع النص الأصلي");break;
   case "savemine":
     var s=ui.editor,name=(s.name||"").trim()||byId[s.sourceId].title,now=Date.now();
     var rec={id:s.mineId||("m"+now),sourceId:s.sourceId,name:name,base:s.base,bpm:s.bpm,removed:s.removed.slice(),added:s.added.slice(),options:s.options.slice(),output:build(s),updated:now};
     var ix=-1;mine.forEach(function(m,k){if(m.id===rec.id)ix=k});
     if(ix>=0)mine[ix]=rec;else mine.push(rec);
     s.mineId=rec.id;persistMine();
     toast(ix>=0?"تم حفظ التعديلات":"تم الحفظ في برومبتاتي");renderEditor();break;
   case "copymine": var m=mine.filter(function(x){return x.id===id})[0];if(m)copyText(m.output); break;
   case "editmine": editMine(id); break;
   case "delmine":
     if(armed===id){mine=mine.filter(function(x){return x.id!==id});armed=null;persistMine();renderMine();toast("تم الحذف")}
     else{armed=id;document.querySelectorAll('[data-act="delmine"]').forEach(function(b){b.classList.remove("armed");b.textContent="حذف"});
       a.classList.add("armed");a.textContent="تأكيد الحذف";clearTimeout(armT);
       armT=setTimeout(function(){armed=null;a.classList.remove("armed");a.textContent="حذف"},4000)}
     break;
  }
});
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&layer.innerHTML)closeSheet()});

function render(){
  closeSheet();
  var v=current();
  document.querySelectorAll(".tab").forEach(function(t){t.getAttribute("data-go")===v||(v==="editor"&&t.getAttribute("data-go")==="mine"&&ui.editor&&ui.editor.mineId)?t.setAttribute("aria-current","page"):t.removeAttribute("aria-current")});
  document.body.setAttribute("data-view",v);
  ({home:renderHome,library:renderLibrary,favorites:renderFavs,mine:renderMine,tips:renderTips,editor:renderEditor})[v]();
}
updateCounts();render();
window.__SPS={P:P,CATS:CATS,build:build};
})();
</script>
</body>
</html>
